services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-imam-app
    container_name: bank_imam_app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - bank-imam-network

  webserver:
    image: nginx:alpine
    container_name: bank_imam_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bank-imam-network

  db:
    image: mysql:5.7
    container_name: bank_imam_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bank_imam
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: bank_imam
    volumes:
      - dbdata:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    networks:
      - bank-imam-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bank_imam_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - bank-imam-network

networks:
  bank-imam-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
